name: Convergent Networks
description: Convergent Networks, Inc. was a carrier-grade broadband voice infrastructure vendor
  that built next-generation VoIP switching and signaling equipment for telecommunications carriers,
  including the ICS2000 and Commando media gateways, the PacketMatrix softswitch controller for call
  screening and number translation, and the ICSG SS7 signaling gateway. Venture-backed by Battery
  Ventures and Saints Capital (raising roughly $57M across two rounds), the company was acquired by
  Eastern Photonics, a subsidiary of Global NAPs, in 2003. It is defunct and publishes no active
  developer portal, API, or specification. This profile was surfaced from the Battery Ventures portfolio
  as a lead; the enrichment pipeline found no live API surface to harvest.
